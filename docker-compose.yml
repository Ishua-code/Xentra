services:
  db:
    image: postgres:17
    container_name: xentra-db
    environment:
      POSTGRES_USER: xentra
      POSTGRES_PASSWORD: xentra
      POSTGRES_DB: xentra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xentra -d xentra"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: xentra-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+asyncpg://xentra:xentra@db:5432/xentra
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: